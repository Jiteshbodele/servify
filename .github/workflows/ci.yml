name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:

  # ── User Service ────────────────────────────────────────────
  test-user-service:
    name: Test user-service
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB:       users_db
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: user-service/requirements.txt

      - name: Install dependencies
        run: |
          cd user-service
          pip install -r requirements.txt

      - name: Create .env
        run: |
          cd user-service
          cat > .env << EOF
          SECRET_KEY=test-secret-key-for-ci
          DEBUG=True
          DB_NAME=users_db
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_HOST=localhost
          DB_PORT=5432
          REDIS_URL=redis://localhost:6379/1
          KAFKA_BOOTSTRAP_SERVERS=localhost:9092
          JWT_ACCESS_LIFETIME_MINUTES=60
          JWT_REFRESH_LIFETIME_DAYS=7
          INTERNAL_SECRET=test-internal-secret
          EOF

      - name: Run migrations
        run: |
          cd user-service
          python manage.py migrate --noinput

      - name: Run tests
        run: |
          cd user-service
          python manage.py test tests --verbosity=2

  # ── Booking Service ─────────────────────────────────────────
  test-booking-service:
    name: Test booking-service
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB:       booking_db
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: booking-service/requirements.txt

      - name: Install dependencies
        run: |
          cd booking-service
          pip install -r requirements.txt

      - name: Create .env
        run: |
          cd booking-service
          cat > .env << EOF
          SECRET_KEY=test-secret-key-for-ci
          DEBUG=True
          DB_NAME=booking_db
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_HOST=localhost
          DB_PORT=5432
          KAFKA_BOOTSTRAP_SERVERS=localhost:9092
          REDIS_URL=redis://localhost:6379/2
          USER_SERVICE_URL=http://localhost:8001
          CATALOG_SERVICE_URL=http://localhost:8002
          INTERNAL_SECRET=test-internal-secret
          JWT_SECRET=test-jwt-secret
          EOF

      - name: Run migrations
        run: |
          cd booking-service
          python manage.py migrate --noinput

      - name: Run tests
        run: |
          cd booking-service
          python manage.py test tests --verbosity=2

  # ── Catalog Service ─────────────────────────────────────────
  test-catalog-service:
    name: Test catalog-service
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB:       catalog_db
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: catalog-service/requirements.txt
      - name: Install dependencies
        run: cd catalog-service && pip install -r requirements.txt
      - name: Create .env
        run: |
          cd catalog-service
          echo "SECRET_KEY=test-secret-key
          DEBUG=True
          DB_NAME=catalog_db
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_HOST=localhost
          DB_PORT=5432
          INTERNAL_SECRET=test-internal-secret
          JWT_SECRET=test-jwt-secret" > .env
      - name: Run migrations
        run: cd catalog-service && python manage.py migrate --noinput
      - name: Run tests
        run: cd catalog-service && python manage.py test tests --verbosity=2

  # ── Review Service ──────────────────────────────────────────
  test-review-service:
    name: Test review-service
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB:       review_db
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: review-service/requirements.txt
      - name: Install dependencies
        run: cd review-service && pip install -r requirements.txt
      - name: Create .env
        run: |
          cd review-service
          echo "SECRET_KEY=test-secret-key
          DEBUG=True
          DB_NAME=review_db
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_HOST=localhost
          DB_PORT=5432
          KAFKA_BOOTSTRAP_SERVERS=localhost:9092
          USER_SERVICE_URL=http://localhost:8001
          BOOKING_SERVICE_URL=http://localhost:8003
          INTERNAL_SECRET=test-internal-secret
          JWT_SECRET=test-jwt-secret" > .env
      - name: Run migrations
        run: cd review-service && python manage.py migrate --noinput
      - name: Run tests
        run: cd review-service && python manage.py test tests --verbosity=2

  # ── Docker Build Check ──────────────────────────────────────
  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    needs:
      - test-user-service
      - test-booking-service
      - test-catalog-service
      - test-review-service

    steps:
      - uses: actions/checkout@v4

      - name: Create all .env files for build
        run: |
          for svc in user-service catalog-service booking-service payment-service notification-service review-service search-service chat-service api-gateway; do
            cp microservices/$svc/.env.example microservices/$svc/.env 2>/dev/null || true
          done

      - name: Build all Docker images
        run: |
          cd microservices
          docker-compose build --parallel

  # ── Lint ────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install flake8
        run: pip install flake8
      - name: Lint all services
        run: |
          for svc in user-service catalog-service booking-service payment-service notification-service review-service search-service chat-service api-gateway; do
            echo "Linting $svc..."
            flake8 microservices/$svc \
              --max-line-length=120 \
              --exclude=migrations,__pycache__,*.pyc \
              --ignore=E501,W503 || true
          done
