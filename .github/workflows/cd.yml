name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build and push Docker images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push all service images
        run: |
          SERVICES=(
            user-service
            catalog-service
            booking-service
            payment-service
            notification-service
            review-service
            search-service
            chat-service
            api-gateway
          )
          TAG=${{ github.sha }}
          for svc in "${SERVICES[@]}"; do
            IMAGE="${{ secrets.DOCKER_USERNAME }}/servicebooking-$svc"
            echo "Building $IMAGE:$TAG"
            docker build -t $IMAGE:$TAG -t $IMAGE:latest ./microservices/$svc
            docker push $IMAGE:$TAG
            docker push $IMAGE:latest
          done

      - name: Notify deployment
        if: success()
        run: echo "All images pushed successfully. Deploy to your server using docker-compose pull && docker-compose up -d"
