version: '3.9'

services:

  # ── Databases ──────────────────────────────────────────────
  postgres-users:
    image: postgres:15
    environment: { POSTGRES_DB: users_db, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    ports: ["5433:5432"]
    volumes: [pgdata-users:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  postgres-catalog:
    image: postgres:15
    environment: { POSTGRES_DB: catalog_db, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    ports: ["5434:5432"]
    volumes: [pgdata-catalog:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  postgres-booking:
    image: postgres:15
    environment: { POSTGRES_DB: booking_db, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    ports: ["5435:5432"]
    volumes: [pgdata-booking:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  postgres-payment:
    image: postgres:15
    environment: { POSTGRES_DB: payment_db, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    ports: ["5436:5432"]
    volumes: [pgdata-payment:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  postgres-notification:
    image: postgres:15
    environment: { POSTGRES_DB: notification_db, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    ports: ["5437:5432"]
    volumes: [pgdata-notification:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  postgres-review:
    image: postgres:15
    environment: { POSTGRES_DB: review_db, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    ports: ["5438:5432"]
    volumes: [pgdata-review:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  postgres-calling:
    image: postgres:15
    environment: { POSTGRES_DB: calling_db, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    ports: ["5440:5432"]
    volumes: [pgdata-calling:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Infra ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "zookeeper-shell", "localhost:2181", "ls", "/"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      # Add these for faster health checks
      KAFKA_HEALTH_ENDpoint: /v3/brokers/1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  elasticsearch:
    image: elasticsearch:8.12.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"  # Add this line
    ports: ["9200:9200"]
    volumes: [esdata:/usr/share/elasticsearch/data]
    mem_limit: 1g  # Add memory limit
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application Services ───────────────────────────────────
  user-service:
    build: ./user-service
    ports: ["8001:8001"]
    depends_on:
      postgres-users:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file: ./user-service/.env
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8001 --workers 2 --reload"

  catalog-service:
    build: ./catalog-service
    ports: ["8002:8002"]
    depends_on:
      postgres-catalog:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file: ./catalog-service/.env
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8002 --workers 2 --reload"

  booking-service:
    build: ./booking-service
    ports: ["8003:8003"]
    depends_on:
      postgres-booking:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file: ./booking-service/.env
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8003 --workers 2 --reload"

  payment-service:
    build: ./payment-service
    ports: ["8004:8004"]
    depends_on:
      postgres-payment:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file: ./payment-service/.env
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8004 --workers 2 --reload"

  notification-service:
    build: ./notification-service
    ports: ["8005:8005"]
    depends_on:
      postgres-notification:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file: ./notification-service/.env
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8005 --workers 2 --reload"

  review-service:
    build: ./review-service
    ports: ["8006:8006"]
    depends_on:
      postgres-review:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file: ./review-service/.env
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8006 --workers 2 --reload"

  search-service:
    build: ./search-service
    ports: ["8007:8007"]
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file: ./search-service/.env
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8007 --workers 2 --reload

  calling-service:
    build: ./calling-service
    ports: ["8008:8008"]
    depends_on:
      postgres-calling:
        condition: service_healthy
    env_file: ./calling-service/.env
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8008 --workers 2 --reload"

  api-gateway:
    build: ./api-gateway
    ports: ["8000:8000"]
    depends_on:
      user-service:
        condition: service_started
      catalog-service:
        condition: service_started
      booking-service:
        condition: service_started
      payment-service:
        condition: service_started
      notification-service:
        condition: service_started
      review-service:
        condition: service_started
      search-service:
        condition: service_started
      calling-service:
        condition: service_started
    env_file: ./api-gateway/.env
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --reload

  # ── Kafka Consumers (restart independently) ────────────────
  notification-consumer:
    build: ./notification-service
    restart: always
    depends_on:
      postgres-notification:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file: ./notification-service/.env
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py consume_events"

  search-consumer:
    build: ./search-service
    restart: always
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file: ./search-service/.env
    command: python manage.py consume_events

volumes:
  pgdata-users:
  pgdata-catalog:
  pgdata-booking:
  pgdata-payment:
  pgdata-notification:
  pgdata-review:
  pgdata-calling:
  esdata: