version: '3.9'

services:

  # ── Databases ──────────────────────────────────────────────
  postgres-users:
    image: postgres:15
    environment: { POSTGRES_DB: users_db, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    ports: ["5433:5432"]
    volumes: [pgdata-users:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  postgres-catalog:
    image: postgres:15
    environment: { POSTGRES_DB: catalog_db, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    ports: ["5434:5432"]
    volumes: [pgdata-catalog:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  postgres-booking:
    image: postgres:15
    environment: { POSTGRES_DB: booking_db, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    ports: ["5435:5432"]
    volumes: [pgdata-booking:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  postgres-payment:
    image: postgres:15
    environment: { POSTGRES_DB: payment_db, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    ports: ["5436:5432"]
    volumes: [pgdata-payment:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  postgres-notification:
    image: postgres:15
    environment: { POSTGRES_DB: notification_db, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    ports: ["5437:5432"]
    volumes: [pgdata-notification:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  postgres-review:
    image: postgres:15
    environment: { POSTGRES_DB: review_db, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    ports: ["5438:5432"]
    volumes: [pgdata-review:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  postgres-chat:
    image: postgres:15
    environment: { POSTGRES_DB: chat_db, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    ports: ["5439:5432"]
    volumes: [pgdata-chat:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  # ── Infra ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

  elasticsearch:
    image: elasticsearch:8.12.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
    ports: ["9200:9200"]
    volumes: [esdata:/usr/share/elasticsearch/data]

  # ── Application Services ───────────────────────────────────
  user-service:
    build: ./user-service
    ports: ["8001:8001"]
    depends_on:
      postgres-users:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    env_file: ./user-service/.env
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8001 --workers 2 --reload"

  catalog-service:
    build: ./catalog-service
    ports: ["8002:8002"]
    depends_on:
      postgres-catalog:
        condition: service_healthy
    env_file: ./catalog-service/.env
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8002 --workers 2 --reload"

  booking-service:
    build: ./booking-service
    ports: ["8003:8003"]
    depends_on:
      postgres-booking:
        condition: service_healthy
      kafka:
        condition: service_started
    env_file: ./booking-service/.env
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8003 --workers 2 --reload"

  payment-service:
    build: ./payment-service
    ports: ["8004:8004"]
    depends_on:
      postgres-payment:
        condition: service_healthy
      kafka:
        condition: service_started
    env_file: ./payment-service/.env
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8004 --workers 2 --reload"

  notification-service:
    build: ./notification-service
    ports: ["8005:8005"]
    depends_on:
      postgres-notification:
        condition: service_healthy
      kafka:
        condition: service_started
    env_file: ./notification-service/.env
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8005 --workers 2 --reload"

  review-service:
    build: ./review-service
    ports: ["8006:8006"]
    depends_on:
      postgres-review:
        condition: service_healthy
      kafka:
        condition: service_started
    env_file: ./review-service/.env
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8006 --workers 2 --reload"

  search-service:
    build: ./search-service
    ports: ["8007:8007"]
    depends_on: [elasticsearch, kafka]
    env_file: ./search-service/.env
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8007 --workers 2 --reload

  chat-service:
    build: ./chat-service
    ports: ["8008:8008"]
    depends_on:
      postgres-chat:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: ./chat-service/.env
    command: >
      sh -c "python manage.py migrate --noinput &&
             daphne -b 0.0.0.0 -p 8008 config.asgi:application"

  api-gateway:
    build: ./api-gateway
    ports: ["8000:8000"]
    depends_on:
      - user-service
      - catalog-service
      - booking-service
      - payment-service
      - notification-service
      - review-service
      - search-service
      - chat-service
    env_file: ./api-gateway/.env
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --reload

  # ── Kafka Consumers (restart independently) ────────────────
  notification-consumer:
    build: ./notification-service
    restart: always
    depends_on:
      postgres-notification:
        condition: service_healthy
      kafka:
        condition: service_started
    env_file: ./notification-service/.env
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py consume_events"

  search-consumer:
    build: ./search-service
    restart: always
    depends_on:
      - elasticsearch
      - kafka
    env_file: ./search-service/.env
    command: python manage.py consume_events

volumes:
  pgdata-users:
  pgdata-catalog:
  pgdata-booking:
  pgdata-payment:
  pgdata-notification:
  pgdata-review:
  pgdata-chat:
  esdata: